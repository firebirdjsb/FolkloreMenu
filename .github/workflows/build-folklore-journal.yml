name: Build Folklore Hunter Journal
on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project branch
        uses: actions/checkout@v4
      - name: Setup CMake
        uses: lukka/get-cmake@latest
      - name: Show toolchains
        shell: pwsh
        run: cmake --version
      - name: Validate isolated save profile and rollback
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/Test-CryptidHunt-Isolation.ps1
      - name: Configure x64
        shell: pwsh
        run: cmake -S FolkloreHunterJournal-ASI -B FolkloreHunterJournal-ASI/build -G "Visual Studio 18 2026" -A x64
      - name: Compile Release x64
        shell: pwsh
        run: cmake --build FolkloreHunterJournal-ASI/build --config Release --parallel
      - name: Stage separate Journal and Cryptid Hunt x64 plugins
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($module in @('FolkloreHunterJournal','FolkloreCryptidHunt')) {
            $output = Get-ChildItem FolkloreHunterJournal-ASI/build -Recurse -File -Filter "$module.asi" |
              Where-Object { $_.DirectoryName -match 'Release' } | Select-Object -First 1
            if (-not $output) { throw "Compiled $module.asi not found" }
            New-Item -ItemType Directory -Force "dist/$module" | Out-Null
            Copy-Item $output.FullName "dist/$module/$module.asi"
            $pdb = Get-ChildItem FolkloreHunterJournal-ASI/build -Recurse -File -Filter "$module.pdb" | Select-Object -First 1
            if ($pdb) { Copy-Item $pdb.FullName "dist/$module/$module.pdb" }
            $map = Get-ChildItem FolkloreHunterJournal-ASI/build -Recurse -File -Filter "$module.map" | Select-Object -First 1
            if ($map) { Copy-Item $map.FullName "dist/$module/$module.map" }
            $bytes = [IO.File]::ReadAllBytes("dist/$module/$module.asi")
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw "$module is not PE" }
            $pe = [BitConverter]::ToInt32($bytes,0x3C)
            if ([BitConverter]::ToUInt16($bytes,$pe+4) -ne 0x8664) { throw "$module is not PE x64" }
            Get-FileHash "dist/$module/$module.asi" -Algorithm SHA256
          }
          @'
          THE HUNTER'S JOURNAL — Windows x64
          Admin tools, ESP, host creature spawning and general features.
          Possession/creature abilities are now removed from the Journal UI.
          Install FolkloreHunterJournal.asi via the existing ASI loader.
          Journal and Cryptid Hunt are separate DLLs; they can now be
          loaded together using ONE shared DXGI/Win32 hook owner and
          independently registered native update/render callbacks.
          One may also be installed alone. F8 opens both panels when
          both are present. F9 diagnostics, F10 console.
          '@ | Set-Content dist/FolkloreHunterJournal/README.txt
          @'
          FOLKLORE CRYPTID HUNT — Windows x64, experimental mode v0.2
          Standalone session-only custom mode, species rules and private
          Wendigo CameraActor watchpoints. Own F8 game-mode menu and F11 return.
          Native replicated FL_Gamestate.IsNight day/night rules:
          Vampire daytime melee/scream locked and severe local glare.
          Wendigo daytime attacks locked and mild local glare.
          Wendigo has 2 watch-camera deployments per in-game day,
          4 active max, and briefly hides when placing a camera.
          Vampire other skill effects and remote player role handoff need testing.
          C deploy Wendigo watchpoint, V cycle (includes chase view).
          Host can randomly draw a selected participating player in local UI,
          but remote-client join/ready messaging and remote possession
          are NOT networked. Do not misrepresent this as a ready PvP mode.
          Install FolkloreCryptidHunt.asi via the existing ASI loader.
          May coexist with FolkloreHunterJournal.asi: only the first
          ASI hooks DXGI/Win32, second uses exported bridge callbacks.
          Do NOT copy both an ASI and renamed DLL of the same mod.
          The native MAIN MENU gets a CRYPTID HUNT LOADED badge;
          F8 selects the custom mode for THIS SESSION only (OFF on launch).
          Use the game's normal create/join lobby and choose map there:
          Night of the Wendigo -> Wendigo; Bloodfang -> Vampire;
          Operation Blackwing -> Mothman.
          No SaveGame APIs or chosen contract overrides in this module.
          The base game can still write its normal progress and saves.
          Camera settings: %LOCALAPPDATA%\FolkloreCryptidHunt\cryptid-hunt.ini.
          F8 mode panels, F9 diagnostics, F11 return human.
          This is an experimental private-game development candidate.
          '@ | Set-Content dist/FolkloreCryptidHunt/README.txt
      - name: Upload Journal
        uses: actions/upload-artifact@v4
        with:
          name: FolkloreHunterJournal-x64-Admin-NoPossession
          path: dist/FolkloreHunterJournal/*
          if-no-files-found: error
      - name: Upload standalone Cryptid Hunt game mode
        uses: actions/upload-artifact@v4
        with:
          name: FolkloreCryptidHunt-x64-Standalone-GameMode-Prototype
          path: dist/FolkloreCryptidHunt/*
          if-no-files-found: error
